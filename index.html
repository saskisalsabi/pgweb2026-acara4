<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeafleatJS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // initialize map
        var map = L.map('map').setView([-7.8775305, 111.9983196], 12);
        // Tile Layer Base Map
        var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });

        var Esri_WorldImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });

        var rupabumiindonesia = L.tileLayer('https://geoservices.big.go.id/rbi/rest/services/BASEMAP/Rupabumi_Indonesia/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Badan Informasi Geospasial'
        });
        var Esri_WorldTerrain = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, TomTom, Intermap, iPC, USGS, FAO, NPS, NRCAN, GeoBase, Kadaster NL, Ordnance Survey, Esri Japan, METI, Esri China (Hong Kong), and the GIS User Community'
        });

        // Menambahkan basemap ke dalam peta
        osm.addTo(map);

        // Marker
        var marker = L.marker([-7.8775305, 111.9983196]);
        var marker2 = L.marker([-7.8195904, 112.0288968]);

        // Menambahkan marker ke dalam peta
        marker.addTo(map);
        marker2.addTo(map);

        // Popup
        marker.bindPopup("<b>Permen Tape Cap Kelapa</b><br>Permen Tape Cap Kelapa merupakan salah satu jajanan legendaris khas Desa Rembang, Ngadiluwih, Kediri, yang memadukan kelezatan tape singkong pilihan dengan gurihnya kelapa parut sangrai. Kuliner tradisional skala UKM yang dirintis oleh Ibu Musfiroh sejak tahun 1979 ini tetap mempertahankan cita rasa manis, legit, dan berserat alami melalui proses pengolahan konvensional tanpa pengawet buatan. Dikemas secara sederhana baik kiloan maupun kemasan mini, kudapan jadul bertipe mirip dodol atau suwar-suwir ini senantiasa diburu pembeli sebagai buah tangan otentik khas Kediri yang membangkitkan nostalgia.");
        marker.openPopup();
        marker2.bindPopup("<b>MAN 2 Kota Kediri</b><br>MAN 2 Kota Kediri merupakan madrasah aliyah negeri unggulan di Kota Kediri yang terkenal dengan prestasi akademik dan non-akademik di tingkat nasional hingga internasional. Lembaga pendidikan islami modern yang akrab disapa M2KK ini sukses memadukan kurikulum nasional, sains, dan nilai-nilai keagamaan untuk mencetak generasi Qur'ani yang berwawasan global. Berbekal fasilitas pembelajaran yang lengkap dan lingkungan yang kondusif, sekolah ini senantiasa menjadi madrasah pilihan utama bagi para lulusan terbaik dari berbagai daerah.");
        marker2.openPopup();

        // Tooltip
        marker.bindTooltip("Permen Tape Cap Kelapa");
        marker2.bindTooltip("MAN 2 Kota Kediri");
        //marker.openTooltip();

        // Circle
        var circle = L.circle([-7.9392312, 112.3049927], {
            color: "red", // warna garis
            opacity: 1, // opacity garis
            fillColor: "yellow", // warna fill
            fillOpacity: 0.5, // opacity fill
            radius: 1000, // radius dalam meter
        });

        // Menambahkan circle ke dalam peta
        circle.addTo(map);

        // Popup
        circle.bindPopup("<b>Awas</b><br>Radius 1 Km");
        circle.openPopup();

        // Tooltip
        circle.bindTooltip("Gunung Kelud", { sticky: true });
        circle.openTooltip();

        // Polyline
        var vertexPolyline = [
            [-7.6035870, 112.1127319],
            [-8.0555269, 111.9067383],
        ];
        var polyline = L.polyline(vertexPolyline, {
            color: "red", // warna garis
            weight: 3, // ketebalan garis
            opacity: 1, // opacity garis
        });

        // Menambahkan polyline ke dalam peta
        polyline.addTo(map);

        // Popup
        polyline.bindPopup("<b>Jalan Dhoho</b><br>Ruas jalan sepanjang satu kilometer ini merupakan jantung perekonomian dan sejarah Kota Kediri yang sering dijuluki sebagai Malioboronya Kediri. Ketika siang hari kawasan ini dipenuhi oleh deretan toko sandang dan elektronik, sementara saat malam hari suasananya bertransformasi menjadi pusat kuliner legendaris yang menjajakan nasi pecel tumpang khas Kediri.");
        polyline.openPopup();

        // Tooltip
        polyline.bindTooltip("Jalan Dhoho", { sticky: true });
        polyline.openTooltip();

        // Polygon
        var vertexPolygon = [
            [-8.0527011, 111.8511200],
            [-7.5946405, 112.0475006],
            [-7.5687619, 112.3276520],
            [-8.0438485, 112.3324585],
            [-8.0527011, 111.8511200],
        ];
        var polygon = L.polygon(vertexPolygon, {
            color: "purple", // warna garis
            weight: 1, // ketebalan garis
            opacity: 0.1, // opacity garis
            fillColor: "#0f3", // warna fill
            fillOpacity: 0.5, // opacity fill
        });

        // Menambahkan polygon ke dalam peta
        polygon.addTo(map);

        // Popup
        polygon.bindPopup("<b>Area Kediri</b><br>Kabupaten Kediri memiliki luas wilayah sekitar 1.386,05 kilometer persegi yang terbagi menjadi 26 kecamatan dan mengelilingi Kota Kediri, sementara Kota Kediri sendiri merupakan wilayah enklave seluas 67,23 kilometer persegi yang terbelah oleh aliran Sungai Brantas serta terbagi ke dalam 3 kecamatan.");
        polygon.openPopup();

        // Tooltip
        polygon.bindTooltip("Kediri", { sticky: true });
        polygon.openTooltip();

        // Control Layer
        var baseMaps = {
            "OpenStreetMap": osm,
            "Esri World Imagery": Esri_WorldImagery,
            "Rupa Bumi Indonesia": rupabumiindonesia,
            "Esri World Terrain": Esri_WorldTerrain,
        };

        var overlayMaps = {
            "Permen Tape Cap Kelapa": marker,
            "MAN 2 Kota Kediri": marker2,
            "Gunung Kelud": circle,
            "Jalan Dhoho": polyline,
            "Area Kediri": polygon,
        };

        var controllayer = L.control.layers(baseMaps, overlayMaps, { collapsed: true });
        controllayer.addTo(map);

        // Scale 
        var scale = L.control.scale({
            position: "bottomright",
            imperial: false
        });
        scale.addTo(map);

        // Geolocation
        map.locate({
            setView: true,
            maxZoom: 16,
        });

        // Fungsi untuk menampilkan lokasi
        function onLocationFound(e) {
            var radius = e.accuracy / 2;

            // Menampilkan marker pada lokasi 
            L.marker(e.latlng).addTo(map).bindPopup("Anda berada dalam radius " + radius + " meter dari titik ini").openPopup();

            // Menampilkan circle pada lokasi
            L.circle(e.latlng, radius).addTo(map);
        }

        map.on("locationfound", onLocationFound);

        // Fungsi untuk menampilkan pesan error
        function onLocationError(e) {
            alert(e.message);
        }

        map.on("locationerror", onLocationError);
    </script>
</body>

</html>
